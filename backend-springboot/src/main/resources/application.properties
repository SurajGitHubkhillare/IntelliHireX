spring.application.name=backend

# Server port — Render injects PORT env variable automatically
server.port=${PORT:8080}

# H2 In-Memory Database (compatible with Render free tier ephemeral filesystem)
# DataInitializer.java seeds all demo users and jobs on startup automatically
spring.datasource.url=jdbc:h2:mem:intellihirexdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# JPA Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration — set JWT_SECRET as environment variable on Render
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# Python AI Microservice Configuration — set AI_SERVICE_URL as environment variable on Render
ai.service.url=${AI_SERVICE_URL:http://localhost:8000/api/v1}

