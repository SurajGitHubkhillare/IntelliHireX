spring.application.name=backend
server.port=8080

# H2 Database configuration (File-based persistent storage)
spring.datasource.url=jdbc:h2:file:./data/intellihirexdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Python AI Microservice Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000/api/v1}

